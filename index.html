<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday Gaytri ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #fff0f6);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card {
      background: white;
      width: 85%;
      max-width: 400px;
      padding: 35px 20px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
      color: #ff4f81;
      font-size: 32px;
    }

    h2 {
      color: #333;
    }

    p {
      color: #666;
      font-size: 18px;
      line-height: 1.6;
    }

    .heart {
      font-size: 55px;
      animation: beat 1s infinite;
    }

    @keyframes beat {
      50% { transform: scale(1.2); }
    }

    button {
      background: #ff4f81;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 30px;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="heart">🎂❤️</div>

    <h1>Happy Birthday Gaytri! 🎉</h1>

    <h2>✨ Many Many Happy Returns of the Day ✨</h2>

    <p>
      Wishing you lots of happiness, love and beautiful moments. 💕
      May all your dreams come true and your smile always stay the same! 😊
    </p>

    <button onclick="alert('Once again, Happy Birthday Gaytri! ❤️🎂')">
      Click Me 💖
    </button>
  </div>

</body>
</html>
