<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Gaytri ❤️</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#ff9ecf,#c9a7ff);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:white;
}

.container{
  text-align:center;
  padding:25px;
  animation:fadeIn 2s ease;
}

.small{
  font-size:20px;
  animation:float 2s infinite alternate;
}

h1{
  font-size:42px;
  margin:15px 0;
  text-shadow:0 4px 15px rgba(0,0,0,.2);
}

.name{
  font-size:55px;
  font-weight:bold;
  color:#fff;
  animation:zoom 2s infinite alternate;
}

.message{
  font-size:19px;
  line-height:1.6;
  margin-top:20px;
}

.heart{
  font-size:55px;
  margin-top:20px;
  animation:beat 1s infinite;
}

button{
  margin-top:25px;
  padding:13px 28px;
  border:none;
  border-radius:30px;
  background:white;
  color:#e85ba8;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
}

button:active{
  transform:scale(.95);
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(40px);}
  to{opacity:1; transform:translateY(0);}
}

@keyframes zoom{
  from{transform:scale(1);}
  to{transform:scale(1.08);}
}

@keyframes beat{
  50%{transform:scale(1.25);}
}

@keyframes float{
  from{transform:translateY(0);}
  to{transform:translateY(-10px);}
}
</style>
</head>

<body>

<div class="container">

  <div class="small">✨ A Little Surprise For You ✨</div>

  <h1>Happy Birthday in Advance</h1>

  <div class="name">Gaytri ❤️</div>

  <p class="message">
    काही लोक आयुष्यात येतात<br>
    आणि आयुष्य थोडं जास्त सुंदर करून जातात... 💕<br><br>

    तू त्यापैकीच एक आहेस! 🌸<br>
    तुझा Birthday येण्याआधीच<br>
    तुला माझ्याकडून एक छोटीशी wish... 🎂✨
  </p>

  <div class="heart">💖</div>

  <button onclick="showWish()">Tap For A Surprise 🎁</button>

</div>

<script>
function showWish(){
  alert("Happy Birthday in Advance Gaytri! 🎂❤️ May your special day be filled with lots of happiness, smiles and beautiful memories! ✨");
}
</script>

</body>
</html>
